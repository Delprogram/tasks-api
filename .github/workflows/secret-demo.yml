name: Secret demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier que le secret existe
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "::error::Le secret DEMO_TOKEN est vide ou absent"
            exit 1
          fi
          echo "Secret présent."

      - name: Longueur du secret
        run: |
          echo "Longueur du secret : ${#DEMO_TOKEN} caractères"

      - name: Tentative d'affichage de la valeur
        run: |
          echo "Valeur du secret : $DEMO_TOKEN"

      - name: Variable APP_ENV
        run: |
          echo "APP_ENV = ${{ vars.APP_ENV }}"

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Calculer le nom de l'image et la version
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-api" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.vars.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image du commit
        run: docker run -d --name api -p 8000:8000 "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}"

      - name: Test de fumée
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            echo "Essai $i : pas encore prêt"
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS http://localhost:8000/version

      - name: Logs du conteneur
        if: always()
        run: docker logs api

  deploy-production:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lancer l'image de la release
        run: docker run -d --name api -p 8000:8000 "${{ needs.build.outputs.image }}:${{ needs.build.outputs.version }}"

      - name: Test de fumée
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            echo "Essai $i : pas encore prêt"
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS http://localhost:8000/version | tee version.json
          grep -q '"${{ needs.build.outputs.version }}"' version.json

      - name: Logs du conteneur
        if: always()
        run: docker logs api

  update-config:
    needs: [build, deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt applicatif
        uses: actions/checkout@v6

      - name: Récupérer le dépôt tasks-config
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/tasks-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Mettre à jour la version dans tasks-config
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash scripts/set-image-tag.sh config/k8s/deployment.yaml "$VERSION"
          cd config
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Déploie tasks-api $VERSION"
          git push
